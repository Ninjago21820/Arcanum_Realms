modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Ninjago21820/Arcanum_Realms/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# Fichier 128x128 affiche dans la liste des mods
logoFile="logo.png"
authors="${mod_authors}"
description='''${mod_description}'''
# Le jeu doit savoir ou chercher les traductions : elles sont incluses dans le jar.

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
